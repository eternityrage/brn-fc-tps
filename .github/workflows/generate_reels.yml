name: Auto Viral Reels Generator

on:
  # 1. Scheduled run: Runs every day at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
    
  # 2. Manual trigger: Lets you click "Run workflow" from GitHub UI / phone
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: true
        default: '5'
        type: string
      mode:
        description: 'Gameplay Mode (all, swing, falling, orbit, zoom, crossfire, pyramid)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - swing
          - falling
          - orbit
          - zoom
          - crossfire
          - pyramid

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg (with audio support)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Asset Library (if needed)
        run: |
          python download_mega_pack.py

      - name: Generate Viral Reels
        run: |
          python master_factory.py --count ${{ github.event.inputs.count || '5' }} --mode ${{ github.event.inputs.mode || 'all' }}

      - name: Package and Upload Reels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-reels-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14
