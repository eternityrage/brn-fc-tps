name: Auto Publish Viral Reels

on:
  schedule:
    # Runs 3 times daily: 04:00 UTC, 12:00 UTC, 20:00 UTC
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Gameplay Mode (leave empty for random, or choose e.g. swing_horizontal, falling_gravity, orbit_carousel)'
        required: false
        default: ''
        type: string
      asset:
        description: 'Asset name (leave empty for random, e.g. apple, fire, rocket, lion)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: publish-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Core Assets
        run: |
          python download_mega_pack.py

      - name: Generate & Publish Viral Reel
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python daily_puzzle_publisher.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.asset }}"

      - name: Commit & Push Published History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_reels.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update published reels log [skip ci]"
            git pull --rebase
            git push
            echo "✅ Published history saved."
          else
            echo "ℹ️ No changes to published history."
          fi
