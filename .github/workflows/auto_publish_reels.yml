name: Auto Publish Viral Reels Network

on:
  schedule:
    # Runs 4 times daily: 00:00 UTC, 06:00 UTC, 12:00 UTC, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'

  workflow_dispatch:
    inputs:
      page:
        description: 'Target Page (all, brainfocus, mindmath, brainfog, braintaps_flow, mindview, mindquiz)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - brainfocus
          - mindmath
          - brainfog
          - braintaps_flow
          - mindview
          - mindquiz
      mode:
        description: 'Gameplay Mode override (leave empty for automatic selection)'
        required: false
        default: ''
        type: string
      hero:
        description: 'Hero asset override (leave empty for automatic selection)'
        required: false
        default: ''
        type: string
      item:
        description: 'Item asset override (leave empty for automatic selection)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: publish-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Core Assets
        run: |
          python download_mega_pack.py

      - name: Generate & Publish Viral Reels
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python network_publisher.py \
            --page "${{ github.event.inputs.page || 'all' }}" \
            ${{ github.event.inputs.mode && format('--mode "{0}"', github.event.inputs.mode) || '' }} \
            ${{ github.event.inputs.hero && format('--hero "{0}"', github.event.inputs.hero) || '' }} \
            ${{ github.event.inputs.item && format('--item "{0}"', github.event.inputs.item) || '' }}

      - name: Commit & Push Published History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_reels.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update published network reels log [skip ci]"
            git pull --rebase
            git push
            echo "✅ Published history saved."
          else
            echo "ℹ️ No changes to published history."
          fi
